# WIFI_SSID 和 WIFI_PASSWORD 都留空时，仍使用原来的手工连接方式。
WIFI_SSID=Dyna-5G
WIFI_PASSWORD=Bb2048268567@

# 可选：指定无线网卡，例如 wlan0；留空时自动选择第一个无线设备。
